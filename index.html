<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duygu Koleksiyonu</title>
    <style>
        /* === GENEL SAYFA STİLİ === */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Arka plan için hafif hareketli bir gradyan */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #1a1a1a, #2c3e50, #000000);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === BAŞLIK ALANI === */
        h1 {
            color: #fff;
            font-weight: 300;
            font-size: 3rem;
            letter-spacing: 5px;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* === MENÜ KONTEYNERİ === */
        .menu-container {
            display: flex;
            gap: 30px; /* Kartlar arası boşluk */
            flex-wrap: wrap; /* Mobilde alt alta geçsin */
            justify-content: center;
            z-index: 10;
        }

        /* === KART (LİNK) STİLLERİ === */
        .card {
            width: 220px;
            height: 300px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Yazıyı alta it */
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Hover (Üzerine gelince) Efektleri */
        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .card h2 {
            color: #fff;
            font-size: 1.5rem;
            margin: 0;
            z-index: 2;
        }

        .card p {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            margin-top: 10px;
            z-index: 2;
        }

        /* Kartların Arka Plan Kaplaması (Koyuluk verir) */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 1;
        }

        /* --- 1. BAHAR KARTI ÖZEL STİLİ --- */
        .card.spring {
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
        }
        .card.spring:hover {
            border: 2px solid #fff;
        }

        /* --- 2. KARAMSAR KART ÖZEL STİLİ --- */
        .card.gloomy {
            background: #050505;
            border: 1px solid #333;
        }
        .card.gloomy h2 {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
        }
        .card.gloomy:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* --- 3. SONBAHAR KARTI ÖZEL STİLİ --- */
        .card.autumn {
            background: linear-gradient(to bottom, #2c3e50, #fd746c);
        }
        .card.autumn h2 {
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        /* Alt bilgi */
        footer {
            position: absolute;
            bottom: 20px;
            color: #555;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <h1>Ruh Halini Seç</h1>

    <div class="menu-container">
        
        <!-- 1. BAHAR LİNKİ -->
        <a href="bahar/bahar.html" class="card spring">
            <h2>Umut</h2>
            <p>Baharın uyanışı, çiçekler ve mavi gökyüzü.</p>
        </a>

        <!-- 2. KARAMSAR LİNK -->
        <a href="karamsar/karamsar.html" class="card gloomy">
            <h2>Boşluk</h2>
            <p>Yankı yok. Sadece yağmur ve sessizlik.</p>
        </a>

        <!-- 3. SONBAHAR LİNKİ -->
        <a href="sonbahar/sonbahar.html" class="card autumn">
            <h2>Hazan</h2>
            <p>Yaprak dökümü, rüzgar ve huzurlu bir veda.</p>
        </a>

    </div>

    <footer style="font-size:200%;">Muhammed Onur Kuşcu'ya Aittir</footer>

</body>

</html>
