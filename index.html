<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duygu Koleksiyonu</title>
    <style>
        /* === GENEL AYARLAR === */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Arka Plan Animasyonu */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #1a1a1a, #2c3e50, #000000);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Başlık */
        h1 {
            color: #fff;
            font-weight: 300;
            font-size: 3rem;
            letter-spacing: 5px;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Menü Kutusu */
        .menu-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Kartlar */
        .card {
            width: 220px;
            height: 300px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.4s ease;
        }
        .card:hover { transform: translateY(-10px); }

        .card h2 { color: #fff; font-size: 1.5rem; margin: 0; z-index: 2; }
        .card p { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-top: 10px; z-index: 2; }
        
        /* Kart Arka Plan Karartması */
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); z-index: 1;
        }

        /* Renkler */
        .card.spring { background: linear-gradient(to bottom, #4facfe, #00f2fe); }
        .card.gloomy { background: #050505; border: 1px solid #333; }
        .card.autumn { background: linear-gradient(to bottom, #2c3e50, #fd746c); }

        footer { margin-top: 40px; color: #555; font-size: 0.8rem; }

        /* === TELEFON İÇİN ÖZEL AYARLAR (BURASI ÖNEMLİ) === */
        @media screen and (max-width: 768px) {
            h1 { font-size: 2rem; margin-bottom: 30px; }
            
            .card {
                width: 90%; /* Kartları genişlet */
                height: 120px; /* Yüksekliği azalt, yatay yap */
                flex-direction: row; /* Yan yana diz */
                align-items: center;
                justify-content: flex-start;
                gap: 20px;
            }
            
            .card::before { background: linear-gradient(to right, rgba(0,0,0,0.8), transparent); }
            .card p { display: none; } /* Mobilde açıklamayı gizle */
        }
    </style>
</head>
<body>
    <h1>Ruh Halini Seç</h1>
    <div class="menu-container">
        <a href="bahar/bahar.html" class="card spring"><h2>Umut</h2><p>Baharın uyanışı.</p></a>
        <a href="karamsar/karamsar.html" class="card gloomy"><h2>Boşluk</h2><p>Sessizlik ve yağmur.</p></a>
        <a href="sonbahar/sonbahar.html" class="card autumn"><h2>Hazan</h2><p>Yaprak dökümü.</p></a>
        <!-- === YENİ EKLENEN KARTLAR === -->
        <a href="anne.html" class="card mother"><h2>Anne İçin</h2><p>Koşulsuz sevgi.</p></a>
        <a href="temizsayfa.html" class="card newleaf"><h2>Temiz Sayfa</h2><p>Yeniden başlamak.</p></a>
        
    </div>
    <footer style="font-size:150%;">Muhammed Onur Kuşcu'ya Aittir.</footer>
</body>
</html>
